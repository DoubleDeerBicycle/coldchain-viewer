<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冷链温控核验单 · 创界供应链</title>
  <style>
    :root {
      --bg-page: #eef0f2;
      --bg-sheet: #ffffff;
      --bg-subtle: #f7f8fa;
      --ink-primary: #141b24;
      --ink-secondary: #4a5565;
      --ink-muted: #7b8494;
      --line-strong: #c8cfd8;
      --line-soft: #e5e8ed;

      /* 状态色默认按预警，JS 会按 PASS / WARN 切换 */
      --accent: #b45309;
      --accent-bg: #fffbeb;
      --accent-border: #f3d19e;
      --stamp-color: #b45309;
    }

    body.is-pass {
      --accent: #0f6b4a;
      --accent-bg: #f1f8f5;
      --accent-border: #b7decb;
      --stamp-color: #0f6b4a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 28px;
    }

    /* 主单据纸张容器 */
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-sheet);
      border: 1px solid var(--line-strong);
      border-top: 4px solid var(--ink-primary);
      box-shadow: 0 2px 8px rgba(20, 27, 36, 0.06);
    }

    /* 页眉：企业与单据编号 */
    .sheet-head {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .org-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      letter-spacing: 0.02em;
    }

    .doc-title {
      margin: 4px 0 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
    }

    .doc-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border: 1px solid var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent);
      border-radius: 2px;
      white-space: nowrap;
    }

    /* 核验结论条 + 印章 */
    .verdict-band {
      position: relative;
      padding: 16px 20px;
      background: var(--accent-bg);
      border-bottom: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow: hidden;
    }

    .verdict-text {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .verdict-label {
      font-size: 11px;
      color: var(--ink-secondary);
      margin-bottom: 3px;
    }

    .verdict-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .verdict-desc {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-secondary);
    }

    /* 电子质检圆章 */
    .stamp {
      flex-shrink: 0;
      width: 68px;
      height: 68px;
      border: 2px solid var(--stamp-color);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--stamp-color);
      transform: rotate(-12deg);
      opacity: 0.88;
      position: relative;
    }

    .stamp::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px dashed var(--stamp-color);
      border-radius: 50%;
      opacity: 0.65;
    }

    .stamp-main {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .stamp-sub {
      font-size: 9px;
      font-weight: 600;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* 分区通用 */
    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .section:last-of-type {
      border-bottom: none;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
      letter-spacing: 0.04em;
    }

    .section-note {
      font-size: 11px;
      color: var(--ink-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* 2x2 指标表：细线分割表格风格，非气泡卡片 */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line-soft);
      background: var(--bg-subtle);
    }

    .metric-cell {
      padding: 11px 12px;
      background: #ffffff;
    }

    .metric-cell:nth-child(odd) {
      border-right: 1px solid var(--line-soft);
    }

    .metric-cell:nth-child(1),
    .metric-cell:nth-child(2) {
      border-bottom: 1px solid var(--line-soft);
    }

    .metric-name {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .metric-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-secondary);
      margin-left: 2px;
    }

    /* 温区分布标尺（有数值时自动标注范围） */
    .range-box {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--line-soft);
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--ink-secondary);
      margin-bottom: 8px;
    }

    .range-track {
      position: relative;
      height: 6px;
      background: #e1e5eb;
      border-radius: 1px;
    }

    .range-span {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--accent);
      opacity: 0.78;
      border-radius: 1px;
    }

    .range-avg-dot {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: var(--ink-primary);
      transform: translateX(-50%);
    }

    .range-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 10px;
      color: var(--ink-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* 合规率条 */
    .rate-row {
      margin-top: 14px;
    }

    .rate-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .rate-label {
      color: var(--ink-secondary);
    }

    .rate-num {
      font-weight: 700;
      color: var(--ink-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .rate-bar-bg {
      width: 100%;
      height: 6px;
      background: #e6e9ee;
      overflow: hidden;
    }

    .rate-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    /* 运单明细列表 */
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .meta-table tr {
      border-bottom: 1px dashed var(--line-soft);
    }

    .meta-table tr:last-child {
      border-bottom: none;
    }

    .meta-table th {
      text-align: left;
      font-weight: 500;
      color: var(--ink-muted);
      padding: 7px 0;
      width: 36%;
    }

    .meta-table td {
      text-align: right;
      font-weight: 600;
      color: var(--ink-primary);
      padding: 7px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    /* 页脚操作栏 */
    .sheet-foot {
      padding: 12px 20px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .print-btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--ink-primary);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    .print-btn:hover {
      background: #f1f3f5;
    }

    .outer-note {
      margin-top: 12px;
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
    }

    @media print {
      body { background: #ffffff; }
      .page-wrap { padding: 0; display: block; }
      .sheet { max-width: 100%; box-shadow: none; }
      .print-btn, .outer-note { display: none; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <main class="sheet">
      <!-- 顶部单据抬头 -->
      <header class="sheet-head">
        <div>
          <div class="org-name">创界（贵州）供应链管理有限公司</div>
          <h1 class="doc-title">药械冷链温控核验单</h1>
        </div>
        <span id="header-status" class="doc-tag">待核验</span>
      </header>

      <!-- 核验结论栏 -->
      <section class="verdict-band">
        <div class="verdict-text">
          <div class="verdict-label">GSP 质量复核结论</div>
          <h2 id="status-title" class="verdict-title">--</h2>
          <p id="status-desc" class="verdict-desc">--</p>
        </div>
        <div class="stamp" aria-hidden="true">
          <span id="stamp-main" class="stamp-main">--</span>
          <span class="stamp-sub">GSP 核验</span>
        </div>
      </section>

      <!-- 温控实测指标 -->
      <section class="section">
        <div class="section-head">
          <h3 class="section-title">全程温度实测</h3>
          <span class="section-note">UNIT: ℃</span>
        </div>

        <div class="metrics-grid">
          <div class="metric-cell">
            <div class="metric-name">平均动能温度 (MKT)</div>
            <div class="metric-val"><span id="val-mkt">--</span><span class="metric-unit">℃</span></div>
          </div>
          <div class="metric-cell">
            <div class="metric-name">全程平均温度</div>
            <div class="metric-val"><span id="val-avg">--</span><span class="metric-unit">℃</span></div>
          </div>
          <div class="metric-cell">
            <div class="metric-name">全程最高温度</div>
            <div class="metric-val"><span id="val-max">--</span><span class="metric-unit">℃</span></div>
          </div>
          <div class="metric-cell">
            <div class="metric-name">全程最低温度</div>
            <div class="metric-val"><span id="val-min">--</span><span class="metric-unit">℃</span></div>
          </div>
        </div>

        <!-- 极值区间标尺 -->
        <div id="range-box" class="range-box" style="display: none;">
          <div class="range-head">
            <span>实测温幅区间</span>
            <span id="range-span-text">--</span>
          </div>
          <div class="range-track">
            <div id="range-span" class="range-span"></div>
            <div id="range-avg-dot" class="range-avg-dot" title="全程平均温度"></div>
          </div>
          <div class="range-scale">
            <span id="scale-min">0℃</span>
            <span>标准冷链参考区间 (2~8℃)</span>
            <span id="scale-max">12℃</span>
          </div>
        </div>

        <!-- 合规率 -->
        <div class="rate-row">
          <div class="rate-top">
            <span class="rate-label">温控合规率（标准 ≥ 99.0%）</span>
            <span id="val-rate-text" class="rate-num">--%</span>
          </div>
          <div class="rate-bar-bg">
            <div id="val-rate-bar" class="rate-bar-fill"></div>
          </div>
        </div>
      </section>

      <!-- 设备与运输时间记录 -->
      <section class="section">
        <div class="section-head">
          <h3 class="section-title">设备与储运节点</h3>
          <span class="section-note" id="verify-time">--</span>
        </div>

        <table class="meta-table">
          <tbody>
            <tr>
              <th>设备主机编号</th>
              <td id="meta-id">--</td>
            </tr>
            <tr>
              <th>记录启运时间</th>
              <td id="meta-start">--</td>
            </tr>
            <tr>
              <th>记录送达时间</th>
              <td id="meta-end">--</td>
            </tr>
            <tr>
              <th>累计监控时长</th>
              <td id="meta-duration">--</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- 底部归属与打印 -->
      <footer class="sheet-foot">
        <span>GSP 质量管理部 · 电子溯源凭证</span>
        <button type="button" class="print-btn" onclick="window.print()">打印 / 存为PDF</button>
      </footer>
    </main>

    <div class="outer-note">本凭证由随车温控终端数据生成，仅供质检收货核对使用</div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'HCTLINK260417004';
      const startRaw = params.get('start') || '';
      const endRaw = params.get('end') || '';
      const mktRaw = params.get('mkt');
      const avgRaw = params.get('avg');
      const maxRaw = params.get('max');
      const minRaw = params.get('min');
      const rateRaw = params.get('rate');
      const rate = rateRaw !== null && !Number.isNaN(parseFloat(rateRaw)) ? parseFloat(rateRaw) : 0;
      const status = (params.get('status') || 'WARN').toUpperCase();

      function formatDate(str) {
        if (/^\d{12}$/.test(str)) {
          return str.replace(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5');
        }
        return str || '未记录';
      }

      function parseCompactDate(str) {
        if (!/^\d{12}$/.test(str)) return null;
        const y = Number(str.slice(0, 4));
        const m = Number(str.slice(4, 6)) - 1;
        const d = Number(str.slice(6, 8));
        const h = Number(str.slice(8, 10));
        const min = Number(str.slice(10, 12));
        return new Date(y, m, d, h, min);
      }

      function calcDuration(sStr, eStr) {
        const s = parseCompactDate(sStr);
        const e = parseCompactDate(eStr);
        if (!s || !e || e < s) return '未计算';
        const mins = Math.round((e - s) / 60000);
        const days = Math.floor(mins / 1440);
        const hours = Math.floor((mins % 1440) / 60);
        const remMins = mins % 60;
        if (days > 0) return `${days}天 ${hours}小时 ${remMins}分`;
        if (hours > 0) return `${hours}小时 ${remMins}分`;
        return `${remMins}分钟`;
      }

      // 填充基础信息
      document.getElementById('meta-id').textContent = id;
      document.getElementById('meta-start').textContent = formatDate(startRaw);
      document.getElementById('meta-end').textContent = formatDate(endRaw);
      document.getElementById('meta-duration').textContent = calcDuration(startRaw, endRaw);

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById('verify-time').textContent =
        `查验 ${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      // 填充温度数值
      document.getElementById('val-mkt').textContent = mktRaw || '--';
      document.getElementById('val-avg').textContent = avgRaw || '--';
      document.getElementById('val-max').textContent = maxRaw || '--';
      document.getElementById('val-min').textContent = minRaw || '--';

      const clampedRate = Math.max(0, Math.min(100, rate));
      document.getElementById('val-rate-text').textContent = rate.toFixed(1) + '%';
      requestAnimationFrame(() => {
        document.getElementById('val-rate-bar').style.width = clampedRate + '%';
      });

      // 若存在有效最高/最低温，展示温幅区间条
      const minNum = parseFloat(minRaw);
      const maxNum = parseFloat(maxRaw);
      const avgNum = parseFloat(avgRaw);
      if (!Number.isNaN(minNum) && !Number.isNaN(maxNum) && maxNum >= minNum) {
        const scaleMin = Math.min(0, Math.floor(minNum - 1));
        const scaleMax = Math.max(12, Math.ceil(maxNum + 1));
        const span = scaleMax - scaleMin || 1;
        const leftPct = ((minNum - scaleMin) / span) * 100;
        const widthPct = Math.max(2, ((maxNum - minNum) / span) * 100);

        document.getElementById('range-box').style.display = 'block';
        document.getElementById('scale-min').textContent = scaleMin + '℃';
        document.getElementById('scale-max').textContent = scaleMax + '℃';
        document.getElementById('range-span-text').textContent = `${minNum}℃ ~ ${maxNum}℃`;

        const spanEl = document.getElementById('range-span');
        spanEl.style.left = leftPct.toFixed(1) + '%';
        spanEl.style.width = widthPct.toFixed(1) + '%';

        const dotEl = document.getElementById('range-avg-dot');
        if (!Number.isNaN(avgNum)) {
          const avgPct = Math.max(0, Math.min(100, ((avgNum - scaleMin) / span) * 100));
          dotEl.style.left = avgPct.toFixed(1) + '%';
        } else {
          dotEl.style.display = 'none';
        }
      }

      // 判定核验状态
      const isPass = status === 'PASS' && rate >= 99.0;
      const headerStatus = document.getElementById('header-status');
      const statusTitle = document.getElementById('status-title');
      const statusDesc = document.getElementById('status-desc');
      const stampMain = document.getElementById('stamp-main');

      if (isPass) {
        document.body.classList.add('is-pass');
        headerStatus.textContent = '温控合格';
        statusTitle.textContent = '冷链温控核验合格';
        statusDesc.textContent = '本批次药械运输全程温度符合 GSP 规范要求，准予正常收货入库。';
        stampMain.textContent = '合格';
      } else {
        headerStatus.textContent = '超限预警';
        statusTitle.textContent = '温度异常 / 合规率未达标';
        statusDesc.textContent = '监测到全程温度存在超标记录或合规率低于 99.0%，请暂停入库并启动质量复核。';
        stampMain.textContent = '复核';
      }
    })();
  </script>
</body>
</html>
